<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dad's Birthday · Photo Album</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111111;
      color: #ffffff;
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
    }

    /* ── Sticky header ───────────────────────────────────────── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: #111111;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 14px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-left h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .header-left p {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 1px;
    }
    .header-hint {
      font-size: 13px;
      color: rgba(255,255,255,0.38);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Loading / error states ──────────────────────────────── */
    .state-msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 12px;
      color: rgba(255,255,255,0.35);
      font-size: 14px;
    }
    .state-msg.hidden { display: none; }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: rgba(255,255,255,0.5);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Gallery ─────────────────────────────────────────────── */
    .gallery {
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      align-items: start;
    }
    @media (max-width: 680px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 380px) { .gallery { grid-template-columns: 1fr; } }

    .photo-item {
      margin-bottom: 0;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      display: block;
      position: relative;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .photo-item.in { opacity: 1; transform: translateY(0); }

    .photo-item img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  filter 0.3s ease;
    }
    .photo-item:hover img {
      transform: scale(1.03);
      filter: brightness(1.06);
    }

    /* ── Scroll indicator ──────────────────────────────────────── */
    .scroll-indicator {
      display: flex;
      justify-content: center;
      padding: 24px 0 48px;
    }
    .scroll-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.5);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .scroll-btn:hover { background: rgba(255,255,255,0.17); color: rgba(255,255,255,0.8); }

    /* ── Lightbox ────────────────────────────────────────────── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .lightbox.open { opacity: 1; pointer-events: all; }

    .lb-inner img {
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
      display: block;
      border-radius: 12px;
    }
    .lb-close {
      position: fixed;
      top: 16px; right: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.6);
      width: 38px; height: 38px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 1001;
    }
    .lb-close:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.55);
      width: 46px; height: 46px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 1001;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.13); color: #fff; }
    .lb-prev { left: 16px; }
    .lb-next { right: 16px; }
    .lb-counter {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.3);
      z-index: 1001;
    }

    @media (prefers-reduced-motion: reduce) {
      .photo-item, .photo-item img, .spinner { transition: none; animation: none; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <h1>Dad's Birthday 🎂</h1>
      <p id="photoCount">Loading…</p>
    </div>
    <span class="header-hint">Click any photo to expand</span>
  </header>

  <div class="state-msg" id="loading">
    <div class="spinner"></div>
    <span>Loading photos…</span>
  </div>

  <div class="state-msg hidden" id="error">
    <span>⚠ Couldn't load photos. Check the bucket URL in index.html.</span>
  </div>

  <div class="gallery hidden" id="gallery"></div>

  <div class="scroll-indicator hidden" id="scrollIndicator">
    <button class="scroll-btn" aria-label="Scroll down">↓</button>
  </div>

  <div class="lightbox" id="lb">
    <button class="lb-close" id="lbClose">×</button>
    <button class="lb-nav lb-prev" id="lbPrev">‹</button>
    <div class="lb-inner">
      <img id="lbImg" src="" alt="" />
    </div>
    <button class="lb-nav lb-next" id="lbNext">›</button>
    <div class="lb-counter" id="lbCount"></div>
  </div>

  <script>
    const BUCKET_URL = 'https://thembuas.s3.us-east-1.amazonaws.com';

    // Fetches the bucket listing directly — no manifest file needed.
    // Any JPG/PNG/WEBP added to the bucket shows up automatically on refresh.
    async function init() {
      try {
        // 1. Get photo list from S3
        const res = await fetch(BUCKET_URL);
        if (!res.ok) throw new Error(res.statusText);
        const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
        const keys = [...xml.querySelectorAll('Contents Key')]
          .map(el => el.textContent)
          .filter(k => /\.(jpe?g|png|webp)$/i.test(k));
        if (keys.length === 0) throw new Error('No photos found');

        // 2. Load exifr (reads only the first few KB of each file for EXIF data)
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://unpkg.com/exifr/dist/lite.umd.js';
          s.onload = resolve; s.onerror = reject;
          document.head.appendChild(s);
        });

        // 3. Read DateTimeOriginal from each photo in parallel
        const photos = await Promise.all(keys.map(async (key) => {
          const src = `${BUCKET_URL}/${key}`;
          let ts = 0;
          try {
            const exif = await exifr.parse(src, ['DateTimeOriginal']);
            ts = exif?.DateTimeOriginal ? new Date(exif.DateTimeOriginal).getTime() : 0;
          } catch { /* no EXIF — falls back to 0 */ }
          return { src, alt: '', ts };
        }));

        // 4. Sort oldest → newest by photo timestamp
        photos.sort((a, b) => a.ts - b.ts);
        render(photos);
      } catch (err) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
        console.error('Failed to load photos:', err);
      }
    }

    let PHOTOS = [];

    function render(photos) {
      PHOTOS = photos;
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('gallery').classList.remove('hidden');
      document.getElementById('scrollIndicator').classList.remove('hidden');
      document.getElementById('photoCount').textContent =
        `${photos.length} photo${photos.length !== 1 ? 's' : ''} · August 2026`;

      const gallery = document.getElementById('gallery');

      photos.forEach((photo, i) => {
        const item = document.createElement('div');
        item.className = 'photo-item';
        item.dataset.index = i;

        const img = document.createElement('img');
        img.alt = photo.alt || '';
        img.decoding = 'async';

        // reveal only once the image has fully loaded — no layout jumps
        img.addEventListener('load', () => item.classList.add('in'));
        img.addEventListener('error', () => item.classList.add('in'));
        img.src = photo.src;

        item.appendChild(img);
        item.addEventListener('click', () => openLightbox(i));
        gallery.appendChild(item);
      });
    }

    // Scroll button
    document.querySelector('.scroll-btn').addEventListener('click', () => {
      window.scrollBy({ top: window.innerHeight * 0.8, behavior: 'smooth' });
    });

    // ── Lightbox ─────────────────────────────────────────────────────────────
    let current = 0;
    const lb      = document.getElementById('lb');
    const lbImg   = document.getElementById('lbImg');
    const lbCount = document.getElementById('lbCount');

    function openLightbox(i) {
      current = i;
      lbImg.src = PHOTOS[i].src;
      lbImg.alt = PHOTOS[i].alt || '';
      lbCount.textContent = `${i + 1} / ${PHOTOS.length}`;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
      lbImg.src = '';
    }

    function navigate(dir) {
      current = (current + dir + PHOTOS.length) % PHOTOS.length;
      lbImg.src = PHOTOS[current].src;
      lbImg.alt = PHOTOS[current].alt || '';
      lbCount.textContent = `${current + 1} / ${PHOTOS.length}`;
    }

    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    document.getElementById('lbPrev').addEventListener('click', () => navigate(-1));
    document.getElementById('lbNext').addEventListener('click', () => navigate(1));
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });

    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape')    closeLightbox();
      if (e.key === 'ArrowLeft')  navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });

    let tx = 0;
    lb.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
    });

    init();
  </script>
</body>
</html>
